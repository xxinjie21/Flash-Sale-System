# 高并发秒杀系统配置文件
# 环境：开发环境

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: high-concurrency-flash-sale

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    # HikariCP 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: FlashSaleHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    # 密码从环境变量 REDIS_PASSWORD 读取，不写死在仓库中。
    # 本地开发请先设置该环境变量（或在 IDE 运行配置中注入）：
    #   REDIS_PASSWORD=<你的 Redis 密码>
    # 未设置时该值为空，Spring Boot 会按「Redis 未开启认证」处理
    password: ${REDIS_PASSWORD:}
    database: 0
    # 连接池配置
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 消息确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    # 手动 ACK
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# MyBatis-Plus 配置
mybatis-plus:
  # 使用注解方式，无需 XML 配置文件
  # mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.flashsale.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键类型（雪花算法）
      id-type: assign_id

# 日志配置
logging:
  level:
    root: INFO
    com.flashsale: DEBUG
    com.flashsale.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
